[server]
maxUploadSize = 50
# Transformers lazy modules trigger expensive, unnecessary watcher imports.
# Restart the app after source edits instead of using automatic hot reload.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#087C70"
backgroundColor = "#F7F8F4"
secondaryBackgroundColor = "#EFF6F0"
textColor = "#10272C"
