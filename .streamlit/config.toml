[server]
maxUploadSize = 50
# Transformers lazy modules trigger expensive, unnecessary watcher imports.
# Restart the app after source edits instead of using automatic hot reload.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FB"
textColor = "#172033"
