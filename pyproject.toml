[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-document-rag"
version = "0.1.0"
description = "Evidence-grounded question answering over prose, tables, and visual PDF pages"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
